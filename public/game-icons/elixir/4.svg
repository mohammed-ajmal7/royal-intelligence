<svg xmlns="http://www.w3.org/2000/svg" width="64" height="72" viewBox="0 0 128 144">
<title>4 Elixir</title>
<desc>Glossy magenta Clash Royale-style elixir drop with the number 4</desc>
<defs>
  <radialGradient id="magenta" cx="48%" cy="36%" r="68%">
    <stop offset="0" stop-color="#ff22da"/>
    <stop offset=".42" stop-color="#ed00c8"/>
    <stop offset=".72" stop-color="#c900b8"/>
    <stop offset="1" stop-color="#79006f"/>
  </radialGradient>
  <linearGradient id="edge" x1="14" y1="18" x2="111" y2="132" gradientUnits="userSpaceOnUse">
    <stop stop-color="#05030a"/>
    <stop offset=".48" stop-color="#100817"/>
    <stop offset="1" stop-color="#050309"/>
  </linearGradient>
  <radialGradient id="innerGlow" cx="50%" cy="43%" r="60%">
    <stop stop-color="#ff4ce4" stop-opacity=".88"/>
    <stop offset=".62" stop-color="#ff16d4" stop-opacity=".16"/>
    <stop offset="1" stop-color="#8b007e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="shine" cx="50%" cy="50%" r="50%">
    <stop stop-color="#fff" stop-opacity=".9"/>
    <stop offset=".24" stop-color="#fff" stop-opacity=".42"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bottomGloss" x1="37" y1="102" x2="83" y2="137" gradientUnits="userSpaceOnUse">
    <stop stop-color="#ff8aed" stop-opacity="0"/>
    <stop offset=".55" stop-color="#ff91f0" stop-opacity=".68"/>
    <stop offset="1" stop-color="#f000c7" stop-opacity="0"/>
  </linearGradient>
  <filter id="outerShadow" x="-30%" y="-20%" width="160%" height="165%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.3"/>
    <feOffset dy="2.2"/>
    <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <clipPath id="dropClip">
    <path d="M104 4
      C113 3 116 7 116 17
      C117 31 121 52 124 73
      C130 111 111 137 76 140
      C37 143 7 125 6 91
      C4 51 35 15 78 7
      C89 5 98 4 104 4Z"/>
  </clipPath>
</defs>
<g filter="url(#outerShadow)">
  <path d="M104 4
    C113 3 116 7 116 17
    C117 31 121 52 124 73
    C130 111 111 137 76 140
    C37 143 7 125 6 91
    C4 51 35 15 78 7
    C89 5 98 4 104 4Z"
    fill="url(#magenta)" stroke="url(#edge)" stroke-width="4.8"
    stroke-linejoin="round"/>
  <g clip-path="url(#dropClip)">
    <rect x="0" y="0" width="128" height="144" fill="url(#innerGlow)"/>
    <path d="M10 86 C12 47 43 15 84 8 C56 18 34 43 28 72 C22 101 36 128 62 139 C27 137 8 117 10 86Z"
      fill="#ff72eb" opacity=".2"/>
    <path d="M17 92 C18 57 44 28 74 17" fill="none" stroke="#ff85f1"
      stroke-width="3.2" stroke-linecap="round" opacity=".5"/>
    <path d="M20 98 C21 62 49 31 77 22" fill="none" stroke="#ffb6f5"
      stroke-width="1.5" stroke-linecap="round" opacity=".38"/>
    <path d="M24 112 C42 135 87 141 111 112" fill="none"
      stroke="url(#bottomGloss)" stroke-width="9" stroke-linecap="round"/>
    <path d="M31 123 C51 139 91 132 108 112" fill="none"
      stroke="#ff62e3" stroke-width="2.3" stroke-linecap="round" opacity=".42"/>
    <ellipse cx="42" cy="61" rx="9" ry="10" fill="#fff" opacity=".5" filter="url(#softGlow)"/>
    <ellipse cx="42" cy="61" rx="3.2" ry="4" fill="#fff" opacity=".43"/>
    <ellipse cx="91" cy="64" rx="5" ry="7" fill="#fff" opacity=".28" filter="url(#softGlow)"/>
    <path d="M111 22 C117 48 122 75 122 88" fill="none"
      stroke="#ff9af0" stroke-width="1.7" stroke-linecap="round" opacity=".22"/>
  </g>
  <path d="M104 5 C111 4 114 8 114 17" fill="none" stroke="#09040d"
    stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
  <text x="66" y="105" text-anchor="middle"
    fill="#fff" stroke="#fff" stroke-width="1.4" paint-order="stroke fill"
    font-family="Arial,Helvetica,sans-serif" font-size="83"
    font-style="italic" font-weight="900" letter-spacing="0"
    transform="skewX(-7)">4</text>
</g>
</svg>